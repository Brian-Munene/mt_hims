apiVersion: v1
kind: Service
metadata:
  name: {{ include "avocent.fullname" . }}-frontend
  labels:
    {{- include "avocent.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "avocent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avocent.fullname" . }}-frontend
  labels:
    {{- include "avocent.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "avocent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "avocent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DJANGO_API_URL
              value: "http://{{ include "avocent.webService" . }}:8000"
            - name: NEXT_PUBLIC_DJANGO_BASE_URL
              value: {{ .Values.frontend.publicApiUrl | default (printf "http://%s:8000" (include "avocent.webService" .)) | quote }}
            - name: NEXT_PUBLIC_APP_NAME
              value: {{ .Values.frontend.appName | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.frontend.secureCookies | quote }}
            - name: API_ENCRYPTION_ENABLED
              value: {{ .Values.django.apiEncryption.enabled | quote }}
            - name: API_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "avocent.fullname" . }}-backend
                  key: API_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /login/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
