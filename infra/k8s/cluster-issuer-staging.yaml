# Applied manually/via CI after cert-manager is installed (see
# infra/terraform/modules/ingress) — NOT Terraform-managed, since a custom
# resource for a CRD installed in the same apply is unreliable with the
# kubernetes provider.
#
#   kubectl apply -f infra/k8s/cluster-issuer-staging.yaml
#
# Uses Let's Encrypt's STAGING ACME endpoint (higher rate limits, untrusted
# certs) — deliberate for the staging cluster so cert-manager retries during
# setup don't burn against Let's Encrypt's production rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: REPLACE-WITH-YOUR-EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
