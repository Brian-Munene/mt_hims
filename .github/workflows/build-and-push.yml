name: Build and push images

# Builds on every push so an image exists for every commit, but nothing gets
# deployed here — deploy-staging.yml / deploy-production.yml pick a specific
# git-SHA-tagged image explicitly. Keeping build and deploy separate means a
# deploy never races a still-in-progress build.
on:
  push:
    branches: ["**"]

permissions:
  id-token: write # required for google-github-actions/auth's OIDC token exchange
  contents: read

env:
  # Repo variables (not secrets) — values come from `terraform output next_steps`
  # in infra/terraform/environments/staging:
  #   IMAGE_REPO             e.g. africa-south1-docker.pkg.dev/avocent-hims-staging/avocent
  #   GCP_BUILD_WIF_PROVIDER Workload Identity provider resource name
  #   GCP_BUILD_SA           push-only service account on the image repository
  IMAGE_REPO: ${{ vars.IMAGE_REPO }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud auth (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_BUILD_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker login to Artifact Registry
        run: gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: avocent-backend
          file: avocent-backend/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/avocent-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}/avocent-backend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}/avocent-backend:buildcache,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: avocent-frontend
          file: avocent-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}/avocent-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}/avocent-frontend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_REPO }}/avocent-frontend:buildcache,mode=max
