name: Deploy production

# Triggered explicitly by a version tag — production deploys are deliberate
# and versioned, never implicit on every main push. The image tag deployed
# is the SHA that the tag points at, which must already have been built by
# build-and-push.yml (tag a commit that's already on main and already built).
on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Environment "production" — configure required reviewers in repo
    # Settings -> Environments -> production (manual step, no Terraform/API
    # path for a personal-account repo; see infra/terraform's plan notes).
    # The workflow pauses here until a reviewer approves. Also configure this
    # Environment's variables:
    #   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
    #   AKS_CLUSTER_NAME, AKS_RESOURCE_GROUP, KEY_VAULT_NAME, ACR_LOGIN_SERVER
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Fetch secrets from Key Vault and build a throwaway values file
        run: |
          set -euo pipefail
          vault="${{ vars.KEY_VAULT_NAME }}"

          get_secret() {
            local value
            value="$(az keyvault secret show --vault-name "$vault" --name "$1" --query value -o tsv)"
            echo "::add-mask::$value"
            printf '%s' "$value"
          }

          secret_key="$(get_secret SECRET_KEY)"
          db_password="$(get_secret DB_PASSWORD)"
          field_key="$(get_secret FIELD_ENCRYPTION_KEY)"
          api_key="$(get_secret API_ENCRYPTION_KEY)"
          redis_url="$(get_secret REDIS_URL)"
          email_password="$(get_secret EMAIL_HOST_PASSWORD)"

          cat > /tmp/secrets-values.yaml <<EOF
          django:
            secretKey: "$secret_key"
            fieldEncryptionKey: "$field_key"
            apiEncryption:
              key: "$api_key"
          postgres:
            password: "$db_password"
          redis:
            url: "$redis_url"
          email:
            password: "$email_password"
          EOF

      - name: helm upgrade --install
        run: |
          helm upgrade --install avocent-prod deploy/helm/avocent \
            --namespace avocent-prod --create-namespace \
            -f deploy/helm/avocent/values.yaml \
            -f deploy/helm/avocent/values-prod.yaml \
            -f /tmp/secrets-values.yaml \
            --set image.backend.tag=${{ github.sha }} \
            --set image.frontend.tag=${{ github.sha }} \
            --wait --timeout 10m

      - name: Clean up throwaway values file
        if: always()
        run: rm -f /tmp/secrets-values.yaml
