apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "avocent.fullname" . }}-beat
  labels:
    {{- include "avocent.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  # Exactly one beat, replaced (not overlapped) on rollout — two live beat
  # processes would double-fire scheduled reminders and compliance flags.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "avocent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        {{- include "avocent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: beat
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/backend-secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: beat
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          command: ["sh", "docker/entrypoint-beat.sh"]
          {{- include "avocent.backendEnvFrom" . | nindent 10 }}
          {{- with .Values.beat.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
