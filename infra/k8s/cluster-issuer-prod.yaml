# Applied manually/via CI after cert-manager is installed (see
# infra/terraform/modules/ingress) — NOT Terraform-managed, since a custom
# resource for a CRD installed in the same apply is unreliable with the
# kubernetes provider.
#
#   kubectl apply -f infra/k8s/cluster-issuer-prod.yaml
#
# Uses Let's Encrypt's PRODUCTION ACME endpoint — real, trusted certs. Rate
# limits are tighter than staging, so this should already be working
# end-to-end against the staging cluster before applying to production.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE-WITH-YOUR-EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
