name: Deploy staging

# Fires after build-and-push.yml finishes successfully on main, deploying the
# exact commit that was just built (github.event.workflow_run.head_sha) —
# never a commit that might still be mid-build.
on:
  workflow_run:
    workflows: ["Build and push images"]
    branches: [main]
    types: [completed]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Ties this run to the GitHub Environment named "staging" — required so
    # the OIDC token's subject (repo:...:environment:staging, see
    # infra/terraform/modules/github-oidc) matches the deploy service
    # account's Workload Identity binding. Configure this Environment's
    # variables (not secrets) in repo Settings -> Environments -> staging:
    #   GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA,
    #   GKE_CLUSTER_NAME, GKE_LOCATION
    environment: staging
    env:
      RELEASE: avocent-staging
      NAMESPACE: avocent-staging
      VALUES_FILE: deploy/helm/avocent/values-staging.yaml
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Google Cloud auth (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: azure/setup-helm@v4 # cloud-agnostic despite the name — just installs helm

      - name: Fetch secrets from Secret Manager and build a throwaway values file
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          fetch() {
            gcloud secrets versions access latest --secret="$1" --project="$PROJECT"
          }

          # Must run in this shell, not inside $(...) — a workflow command
          # echoed in a subshell is captured into the variable instead of
          # reaching the runner. Masks line by line (multi-line values).
          mask() {
            while IFS= read -r line; do
              # `if`, not `[ ] && echo`: on an empty value the && form returns
              # 1 as the function's status and `set -e` kills the step.
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done <<< "$1"
          }

          # Plain assignments (not `export X="$(...)"`) so a failed fetch
          # trips `set -e`.
          SECRET_KEY="$(fetch SECRET_KEY)"
          DB_PASSWORD="$(fetch DB_PASSWORD)"
          FIELD_ENCRYPTION_KEY="$(fetch FIELD_ENCRYPTION_KEY)"
          API_ENCRYPTION_KEY="$(fetch API_ENCRYPTION_KEY)"
          REDIS_URL="$(fetch REDIS_URL)"
          REDIS_CA_CERT="$(fetch REDIS_CA_CERT)" # not secret, no mask needed
          # No version exists until an SMTP provider is set up by hand —
          # deploy with it empty rather than failing.
          EMAIL_HOST_PASSWORD="$(fetch EMAIL_HOST_PASSWORD 2>/dev/null || true)"

          for v in "$SECRET_KEY" "$DB_PASSWORD" "$FIELD_ENCRYPTION_KEY" "$API_ENCRYPTION_KEY" "$REDIS_URL" "$EMAIL_HOST_PASSWORD"; do
            mask "$v"
          done
          export SECRET_KEY DB_PASSWORD FIELD_ENCRYPTION_KEY API_ENCRYPTION_KEY REDIS_URL REDIS_CA_CERT EMAIL_HOST_PASSWORD

          # JSON is valid YAML and json.dumps escapes everything (quotes, the
          # multi-line CA PEM), unlike interpolating into a YAML heredoc.
          python3 - > "$RUNNER_TEMP/secrets-values.yaml" <<'PY'
          import json, os
          e = os.environ
          print(json.dumps({
              "django": {
                  "secretKey": e["SECRET_KEY"],
                  "fieldEncryptionKey": e["FIELD_ENCRYPTION_KEY"],
                  "apiEncryption": {"key": e["API_ENCRYPTION_KEY"]},
              },
              "postgres": {"password": e["DB_PASSWORD"]},
              "redis": {"url": e["REDIS_URL"], "caCert": e["REDIS_CA_CERT"]},
              "email": {"password": e["EMAIL_HOST_PASSWORD"]},
          }))
          PY

      - name: helm upgrade --install
        # Namespace is created by Terraform (kubernetes_namespace_v1.app), so
        # the deploy identity never needs namespace-create rights.
        run: |
          helm upgrade --install "$RELEASE" deploy/helm/avocent \
            --namespace "$NAMESPACE" \
            -f deploy/helm/avocent/values.yaml \
            -f "$VALUES_FILE" \
            -f "$RUNNER_TEMP/secrets-values.yaml" \
            --set image.backend.tag="$IMAGE_TAG" \
            --set image.frontend.tag="$IMAGE_TAG" \
            --wait --timeout 10m

      - name: Clean up throwaway values file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets-values.yaml"
