name: Deploy production

# Triggered explicitly by a version tag — production deploys are deliberate
# and versioned, never implicit on every main push. The image tag deployed
# is the SHA that the tag points at, which must already have been built by
# build-and-push.yml (tag a commit that's already on main and already built).
on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Environment "production" — configure required reviewers in repo
    # Settings -> Environments -> production (manual step, no Terraform/API
    # path for a personal-account repo). The workflow pauses here until a
    # reviewer approves. Also configure this Environment's variables:
    #   GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA,
    #   GKE_CLUSTER_NAME, GKE_LOCATION
    environment: production
    env:
      RELEASE: avocent-prod
      NAMESPACE: avocent-prod
      VALUES_FILE: deploy/helm/avocent/values-prod.yaml
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud auth (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: azure/setup-helm@v4 # cloud-agnostic despite the name — just installs helm

      - name: Fetch secrets from Secret Manager and build a throwaway values file
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          # See deploy-staging.yml for why fetch/mask are split this way.
          fetch() {
            gcloud secrets versions access latest --secret="$1" --project="$PROJECT"
          }

          mask() {
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::add-mask::$line"; fi
            done <<< "$1"
          }

          SECRET_KEY="$(fetch SECRET_KEY)"
          DB_PASSWORD="$(fetch DB_PASSWORD)"
          FIELD_ENCRYPTION_KEY="$(fetch FIELD_ENCRYPTION_KEY)"
          API_ENCRYPTION_KEY="$(fetch API_ENCRYPTION_KEY)"
          REDIS_URL="$(fetch REDIS_URL)"
          REDIS_CA_CERT="$(fetch REDIS_CA_CERT)"
          EMAIL_HOST_PASSWORD="$(fetch EMAIL_HOST_PASSWORD 2>/dev/null || true)"

          for v in "$SECRET_KEY" "$DB_PASSWORD" "$FIELD_ENCRYPTION_KEY" "$API_ENCRYPTION_KEY" "$REDIS_URL" "$EMAIL_HOST_PASSWORD"; do
            mask "$v"
          done
          export SECRET_KEY DB_PASSWORD FIELD_ENCRYPTION_KEY API_ENCRYPTION_KEY REDIS_URL REDIS_CA_CERT EMAIL_HOST_PASSWORD

          python3 - > "$RUNNER_TEMP/secrets-values.yaml" <<'PY'
          import json, os
          e = os.environ
          print(json.dumps({
              "django": {
                  "secretKey": e["SECRET_KEY"],
                  "fieldEncryptionKey": e["FIELD_ENCRYPTION_KEY"],
                  "apiEncryption": {"key": e["API_ENCRYPTION_KEY"]},
              },
              "postgres": {"password": e["DB_PASSWORD"]},
              "redis": {"url": e["REDIS_URL"], "caCert": e["REDIS_CA_CERT"]},
              "email": {"password": e["EMAIL_HOST_PASSWORD"]},
          }))
          PY

      - name: helm upgrade --install
        run: |
          helm upgrade --install "$RELEASE" deploy/helm/avocent \
            --namespace "$NAMESPACE" \
            -f deploy/helm/avocent/values.yaml \
            -f "$VALUES_FILE" \
            -f "$RUNNER_TEMP/secrets-values.yaml" \
            --set image.backend.tag="$IMAGE_TAG" \
            --set image.frontend.tag="$IMAGE_TAG" \
            --wait --timeout 10m

      - name: Clean up throwaway values file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets-values.yaml"
