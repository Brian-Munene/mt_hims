# Staging overlay for GKE. Non-secret values only — CI (.github/workflows/deploy-staging.yml)
# supplies django.secretKey / postgres.password / django.fieldEncryptionKey /
# django.apiEncryption.key / redis.url / redis.caCert / email.password from the
# staging project's Secret Manager at deploy time via a generated values file,
# never committed here.
#
# REPLACE-WITH-* placeholders come from `terraform output` in
# infra/terraform/environments/staging (see its next_steps output).
#
#   helm upgrade --install avocent-staging ./deploy/helm/avocent \
#     -n avocent-staging \
#     -f deploy/helm/avocent/values.yaml \
#     -f deploy/helm/avocent/values-staging.yaml \
#     -f <secrets file generated from Secret Manager> \
#     --set image.backend.tag=<git-sha> --set image.frontend.tag=<git-sha>

image:
  backend:
    repository: africa-south1-docker.pkg.dev/avocent-hims-staging/avocent/avocent-backend
    pullPolicy: IfNotPresent
  frontend:
    repository: africa-south1-docker.pkg.dev/avocent-hims-staging/avocent/avocent-frontend
    pullPolicy: IfNotPresent

web:
  replicas: 2
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

worker:
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

beat:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 250m, memory: 512Mi}

frontend:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # nip.io until the real domain is registered (infra/GCP_MIGRATION.md step 8).
  publicApiUrl: "https://api.REPLACE-WITH-LB-IP.nip.io"

django:
  debug: false
  frontendUrl: "https://app.REPLACE-WITH-LB-IP.nip.io"
  security:
    sslRedirect: true
    sessionCookieSecure: true
    csrfCookieSecure: true
    hstsSeconds: 31536000
    csrfTrustedOrigins:
      - "https://api.REPLACE-WITH-LB-IP.nip.io"
      - "https://app.REPLACE-WITH-LB-IP.nip.io"

postgres:
  internal: false
  # Cloud SQL private IP — terraform output postgres_private_ip.
  host: "REPLACE-WITH-STAGING-POSTGRES-IP"
  port: 5432
  sslMode: require

redis:
  internal: false
  # url (embeds the AUTH string) and caCert are supplied at deploy time from
  # Secret Manager (rediss://:<auth>@<ip>:6378/0).

serviceAccount:
  create: true
  name: avocent-backend # must match backend_service_account in Terraform
  annotations:
    iam.gke.io/gcp-service-account: avocent-app@avocent-hims-staging.iam.gserviceaccount.com

storage:
  gcsBucket: avocent-hims-staging-media

email:
  configured: true

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  apiHost: "api.REPLACE-WITH-LB-IP.nip.io"
  appHost: "app.REPLACE-WITH-LB-IP.nip.io"
  tls:
    - hosts:
        - "api.REPLACE-WITH-LB-IP.nip.io"
        - "app.REPLACE-WITH-LB-IP.nip.io"
      secretName: avocent-tls
